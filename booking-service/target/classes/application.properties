server.port=8086

spring.application.name=booking-service

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/booking_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=booking-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.properties.spring.json.trusted.packages=com.agacostays.*
spring.kafka.producer.properties.spring.json.add.type.headers=true

services.room.url=${ROOM_SERVICE_URL:http://localhost:8085}
services.user.url=${USER_SERVICE_URL:http://localhost:8082}
services.billing.url=${BILLING_SERVICE_URL:http://localhost:8089}
services.payment.url=${PAYMENT_SERVICE_URL:http://localhost:8088}
services.notification.url=${NOTIFICATION_SERVICE_URL:http://localhost:8090}

security.jwt.secret=${JWT_SECRET:change-this-development-secret-to-at-least-32-characters}

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized

logging.level.com.agacostays.booking=INFO
