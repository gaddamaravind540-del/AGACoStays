##################################################
# APPLICATION
##################################################

spring.application.name=booking-service
server.port=8084

##################################################
# MYSQL DATABASE
##################################################

spring.datasource.url=jdbc:mysql://localhost:3306/booking_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

##################################################
# JPA / HIBERNATE
##################################################

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

##################################################
# HIKARI CONNECTION POOL
##################################################

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

##################################################
# KAFKA
##################################################

spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.consumer.group-id=booking-service-group
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

##################################################
# JWT
##################################################

jwt.secret=your-super-secret-jwt-key-that-should-be-long-and-secure
jwt.expiration=86400000

##################################################
# EUREKA
##################################################

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

##################################################
# OPENFEIGN
##################################################

spring.cloud.openfeign.circuitbreaker.enabled=true

##################################################
# FEIGN CLIENT URLS (OPTIONAL FALLBACK)
##################################################

services.user-service=user-service
services.branch-service=branch-service
services.payment-service=payment-service
services.billing-service=billing-service
services.notification-service=notification-service

##################################################
# SWAGGER / OPENAPI
##################################################

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

##################################################
# ACTUATOR
##################################################

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

##################################################
# LOGGING
##################################################

logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.com.agacostays=DEBUG

##################################################
# JACKSON
##################################################

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null
spring.jackson.time-zone=Asia/Kolkata

##################################################
# SERVER
##################################################

server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never

##################################################
# BOOKING CONFIGURATION
##################################################

booking.default-status=PENDING

booking.cancellation.allowed=true

booking.cancellation.hours-before-checkin=24

booking.payment.timeout-minutes=15

##################################################
# HOTEL BUSINESS RULES
##################################################

hotel.max-guests-per-room=4

hotel.max-booking-days=30

hotel.min-booking-days=1