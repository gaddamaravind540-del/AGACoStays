spring.application.name=restaurant-service
server.port=8093

spring.datasource.url=jdbc:mysql://localhost:3306/restaurant_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

spring.cloud.openfeign.circuitbreaker.enabled=true

spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.consumer.group-id=restaurant-service-group
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

jwt.secret=your-super-secret-jwt-key-that-should-be-long-and-secure
jwt.expiration=86400000

services.auth-service=auth-service
services.user-service=user-service
services.branch-service=branch-service
services.booking-service=booking-service
services.billing-service=billing-service
services.notification-service=notification-service
services.payment-service=payment-service

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

logging.level.com.agacostays=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.security=INFO

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null
spring.jackson.time-zone=Asia/Kolkata

server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never

restaurant.enabled=true

restaurant.currency=INR

restaurant.order.auto-generate-number=true
restaurant.order.prefix=ORD
restaurant.order.default-status=PENDING

restaurant.order.auto-cancel.enabled=true
restaurant.order.auto-cancel-minutes=30

restaurant.table.management.enabled=true
restaurant.table.default-capacity=4
restaurant.table.max-capacity=12

restaurant.reservation.enabled=true
restaurant.reservation.max-days-ahead=30
restaurant.reservation.default-duration-minutes=90

restaurant.menu.enabled=true
restaurant.menu.cache.enabled=true
restaurant.menu.cache-minutes=30
restaurant.menu.image-upload-enabled=true

restaurant.kitchen.enabled=true
restaurant.kitchen.auto-assign-orders=true

restaurant.delivery.enabled=true
restaurant.takeaway.enabled=true

restaurant.tax.enabled=true
restaurant.tax.percentage=5

restaurant.discount.enabled=true

restaurant.inventory.enabled=true
restaurant.inventory.low-stock-threshold=10

restaurant.invoice.enabled=true
restaurant.invoice.generate-pdf=true
restaurant.invoice.storage-path=restaurant-invoices/

restaurant.report.enabled=true
restaurant.report.export-path=restaurant-reports/
restaurant.report.schedule=0 0 2 * * *
restaurant.report.retention-days=90

restaurant.feedback.enabled=true
restaurant.feedback.min-rating=1
restaurant.feedback.max-rating=5

restaurant.notification.enabled=true

restaurant.audit.enabled=true

restaurant.image-storage-path=restaurant-images/

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB