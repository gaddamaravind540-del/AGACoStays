server.port=8087

spring.application.name=restaurant-service

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/restaurant_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true

# Optional in Spring Boot 3.x
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=restaurant-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.properties.spring.json.trusted.packages=com.agacostays.*
spring.kafka.producer.properties.spring.json.add.type.headers=true

services.booking.url=${BOOKING_SERVICE_URL:http://localhost:8086}
services.user.url=${USER_SERVICE_URL:http://localhost:8082}
services.payment.url=${PAYMENT_SERVICE_URL:http://localhost:8088}
services.billing.url=${BILLING_SERVICE_URL:http://localhost:8089}
services.notification.url=${NOTIFICATION_SERVICE_URL:http://localhost:8090}

security.jwt.secret=${JWT_SECRET:change-this-development-secret-to-at-least-32-characters}

storage.local.root=${STORAGE_LOCAL_ROOT:uploads}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized

logging.level.com.agacostays.restaurant=INFO