##################################################
# APPLICATION & SERVER CONFIGURATION
##################################################
spring.application.name=restaurant-service
server.port=8087

##################################################
# MYSQL DATABASE CONFIGURATION
##################################################
spring.datasource.url=jdbc:mysql://localhost:3306/restaurant_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

##################################################
# JPA / HIBERNATE
##################################################
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Auto-escape all SQL identifiers (crucial for 'order' and 'status' keywords in MySQL)
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# Disable Flyway to prevent PostgreSQL DDL syntax conflicts on MySQL
spring.flyway.enabled=false

##################################################
# HIKARI CONNECTION POOL
##################################################
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

##################################################
# EUREKA DISCOVERY CLIENT
##################################################
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

##################################################
# DOWNSTREAM SERVICE URLS (FEIGN & REST CLIENTS)
##################################################
spring.cloud.openfeign.circuitbreaker.enabled=true

# Service Name mappings
services.booking-service=booking-service
services.payment-service=payment-service
services.billing-service=billing-service
services.user-service=user-service
services.notification-service=notification-service

# Booking Service (Port 8086)
services.booking.url=http://localhost:8086
services.booking.base-url=http://localhost:8086
services.booking-service.url=http://localhost:8086
services.booking-service.base-url=http://localhost:8086
service.booking.url=http://localhost:8086
service.booking.base-url=http://localhost:8086
app.clients.booking-service-url=http://localhost:8086

# Payment Service (Port 8088)
services.payment.url=http://localhost:8088
services.payment.base-url=http://localhost:8088
services.payment-service.url=http://localhost:8088
services.payment-service.base-url=http://localhost:8088
service.payment.url=http://localhost:8088
service.payment.base-url=http://localhost:8088
app.clients.payment-service-url=http://localhost:8088

# Billing Service (Port 8089)
services.billing.url=http://localhost:8089
services.billing.base-url=http://localhost:8089
services.billing-service.url=http://localhost:8089
services.billing-service.base-url=http://localhost:8089
service.billing.url=http://localhost:8089
service.billing.base-url=http://localhost:8089
app.clients.billing-service-url=http://localhost:8089

# User Service (Port 8082)
services.user.url=http://localhost:8082
services.user.base-url=http://localhost:8082
services.user-service.url=http://localhost:8082
services.user-service.base-url=http://localhost:8082
service.user.url=http://localhost:8082
service.user.base-url=http://localhost:8082
app.clients.user-service-url=http://localhost:8082

# Notification Service (Port 8090)
services.notification.url=http://localhost:8090
services.notification.base-url=http://localhost:8090
services.notification-service.url=http://localhost:8090
services.notification-service.base-url=http://localhost:8090
service.notification.url=http://localhost:8090
service.notification.base-url=http://localhost:8090
app.clients.notification-service-url=http://localhost:8090

##################################################
# KAFKA CONFIGURATION
##################################################
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=restaurant-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.admin.fail-on-error=false
spring.kafka.listener.missing-topics-fatal=false

##################################################
# JWT AUTHENTICATION
##################################################
jwt.secret=c2VjdXJlLWFnYS1jb3N0YXlzLWF1dGgtc2VjcmV0LWtleS1mb3ItcHJvamVjdC0yMDI2
security.jwt.secret=c2VjdXJlLWFnYS1jb3N0YXlzLWF1dGgtc2VjcmV0LWtleS1mb3ItcHJvamVjdC0yMDI2
app.jwt.secret=c2VjdXJlLWFnYS1jb3N0YXlzLWF1dGgtc2VjcmV0LWtleS1mb3ItcHJvamVjdC0yMDI2
security.jwt.issuer=aga-costays
app.jwt.issuer=aga-costays
jwt.issuer=aga-costays
jwt.expiration=86400000

##################################################
# RESTAURANT & STORAGE SETTINGS
##################################################
restaurant.currency=INR
restaurant.image-storage-path=restaurant-images/
restaurant.image-upload-enabled=true
storage.local.root=uploads
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

##################################################
# SWAGGER & ACTUATOR
##################################################
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

##################################################
# LOGGING & JACKSON
##################################################
logging.level.com.agacostays=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=INFO
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null
spring.jackson.time-zone=Asia/Kolkata
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never