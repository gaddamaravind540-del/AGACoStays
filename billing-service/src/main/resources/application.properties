spring.application.name=billing-service
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
server.port=8089

spring.datasource.url=${BILLING_DB_URL:jdbc:mysql://localhost:3306/billing_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${BILLING_DB_USERNAME:root}
spring.datasource.password=${BILLING_DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Optional in Spring Boot 3.x
 spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=billing-service
spring.kafka.consumer.auto-offset-reset=earliest

spring.jackson.serialization.write-dates-as-timestamps=false

service.booking.url=${BOOKING_SERVICE_URL:http://localhost:8086}
service.restaurant.url=${RESTAURANT_SERVICE_URL:http://localhost:8087}
service.payment.url=${PAYMENT_SERVICE_URL:http://localhost:8088}

billing.default-tax-rate=${BILLING_DEFAULT_TAX_RATE:0.18}
billing.storage.path=${BILLING_STORAGE_PATH:./storage/invoices}
billing.currency=${BILLING_CURRENCY:INR}

security.jwt.secret=${JWT_SECRET:change-this-secret-key-to-a-long-random-value-1234567890}
security.jwt.issuer=${JWT_ISSUER:aga-costays-auth}

management.endpoints.web.exposure.include=health,info,metrics

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html