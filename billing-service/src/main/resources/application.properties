spring.application.name=billing-service
server.port=8087

spring.datasource.url=jdbc:mysql://localhost:3306/billing_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

spring.cloud.openfeign.circuitbreaker.enabled=true

spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.consumer.group-id=billing-service-group
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

jwt.secret=your-super-secret-jwt-key-that-should-be-long-and-secure
jwt.expiration=86400000

services.auth-service=auth-service
services.user-service=user-service
services.booking-service=booking-service
services.payment-service=payment-service
services.notification-service=notification-service

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

logging.level.com.agacostays=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.security=INFO

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null
spring.jackson.time-zone=Asia/Kolkata

server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never

billing.currency=INR
billing.default-status=PENDING

billing.auto-generate-invoice=true

billing.tax.enabled=true
billing.tax.percentage=18

billing.invoice.prefix=INV
billing.invoice.store-path=invoices/
billing.invoice.auto-email=true

billing.payment.reconciliation.enabled=true
billing.payment.retry-count=3

billing.pdf.enabled=true
billing.pdf.output-directory=billing-reports/

billing.audit.enabled=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB