##################################################
# APPLICATION & SERVER CONFIGURATION
##################################################
spring.application.name=billing-service
server.port=8089

##################################################
# MYSQL DATABASE CONFIGURATION
##################################################
spring.datasource.url=jdbc:mysql://localhost:3306/billing_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

##################################################
# JPA / HIBERNATE
##################################################
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Escape SQL identifiers for reserved keywords (order, tax, status, etc.)
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# Disable Flyway to prevent PostgreSQL DDL syntax conflicts on MySQL
spring.flyway.enabled=false

##################################################
# HIKARI CONNECTION POOL
##################################################
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

##################################################
# EUREKA DISCOVERY CLIENT
##################################################
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

##################################################
# BILLING, TAX & CALCULATION SETTINGS
##################################################
billing.default-tax-rate=12.0
billing.default-discount-rate=0.0
billing.tax-rate=12.0
billing.discount-rate=0.0
billing.default-tax=12.0
billing.tax.default-rate=12.0
billing.tax.rate=12.0
billing.tax.gst-percentage=12.0
billing.tax.percentage=12.0
billing.gst.percentage=12.0
billing.gst.rate=12.0
billing.currency=INR
billing.default-currency=INR
billing.invoice.prefix=INV-
billing.invoice.retention-days=365
billing.invoice.storage-path=invoices/
billing.invoice.export-path=invoices/
billing.storage.path=invoices/
billing.storage.root=uploads
storage.local.root=uploads
billing.report.export-path=invoices/

##################################################
# DOWNSTREAM SERVICE URLS (FEIGN & REST CLIENTS)
##################################################
spring.cloud.openfeign.circuitbreaker.enabled=true

# Service Name mappings
services.booking-service=booking-service
services.restaurant-service=restaurant-service
services.payment-service=payment-service
services.user-service=user-service
services.notification-service=notification-service

# Booking Service (Port 8086)
services.booking.url=http://localhost:8086
services.booking.base-url=http://localhost:8086
services.booking-service.url=http://localhost:8086
services.booking-service.base-url=http://localhost:8086
service.booking.url=http://localhost:8086
service.booking.base-url=http://localhost:8086
app.clients.booking-service-url=http://localhost:8086

# Restaurant Service (Port 8087)
services.restaurant.url=http://localhost:8087
services.restaurant.base-url=http://localhost:8087
services.restaurant-service.url=http://localhost:8087
services.restaurant-service.base-url=http://localhost:8087
service.restaurant.url=http://localhost:8087
service.restaurant.base-url=http://localhost:8087
app.clients.restaurant-service-url=http://localhost:8087

# Payment Service (Port 8088)
services.payment.url=http://localhost:8088
services.payment.base-url=http://localhost:8088
services.payment-service.url=http://localhost:8088
services.payment-service.base-url=http://localhost:8088
service.payment.url=http://localhost:8088
