spring.application.name=user-service
server.port=8082

spring.datasource.url=${USER_DB_URL:jdbc:postgresql://localhost:5432/user_db}
spring.datasource.username=${USER_DB_USERNAME:postgres}
spring.datasource.password=${USER_DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.jwt.secret=${JWT_SECRET:c2VjdXJlLWFnYS1jb3N0YXlzLWF1dGgtc2VjcmV0LWtleS1mb3ItcHJvamVjdC0yMDI2}

app.clients.branch-service-url=${BRANCH_SERVICE_URL:http://localhost:8083}
app.clients.notification-service-url=${NOTIFICATION_SERVICE_URL:http://localhost:8090}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

management.endpoints.web.exposure.include=health,info,metrics
logging.level.com.agacostays.user=INFO

app.mapping-cleanup.cron=${USER_MAPPING_CLEANUP_CRON:0 0 2 * * *}

spring.kafka.consumer.group-id=${USER_KAFKA_GROUP:agacostays-user-service}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
app.kafka.topics.user-registered=${AUTH_USER_REGISTERED_TOPIC:auth.user-registered}
