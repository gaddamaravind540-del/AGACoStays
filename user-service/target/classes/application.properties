##################################################
# APPLICATION
##################################################

spring.application.name=user-service
server.port=8082

##################################################
# MYSQL DATABASE
##################################################

spring.datasource.url=jdbc:mysql://localhost:3306/user_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

##################################################
# JPA / HIBERNATE
##################################################

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

##################################################
# HIKARI CONNECTION POOL
##################################################

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

##################################################
# EUREKA
##################################################

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

##################################################
# OPENFEIGN
##################################################

spring.cloud.openfeign.circuitbreaker.enabled=true

##################################################
# FEIGN CLIENT SERVICES
##################################################

services.auth-service=auth-service
services.branch-service=branch-service
services.room-service=room-service
services.booking-service=booking-service
services.payment-service=payment-service
services.notification-service=notification-service
services.support-service=support-feedback-service

##################################################
# KAFKA
##################################################

spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.consumer.group-id=user-service-group
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

##################################################
# JWT
##################################################

jwt.secret=your-super-secret-jwt-key-that-should-be-long-and-secure
jwt.expiration=86400000

##################################################
# SWAGGER / OPENAPI
##################################################

springdoc.api-docs.path=/v3/api-docs

springdoc.swagger-ui.path=/swagger-ui.html

##################################################
# ACTUATOR
##################################################

management.endpoints.web.exposure.include=*

management.endpoint.health.show-details=always

##################################################
# LOGGING
##################################################

logging.level.com.agacostays=DEBUG

logging.level.org.hibernate.SQL=DEBUG

logging.level.org.springframework.security=INFO

##################################################
# JACKSON
##################################################

spring.jackson.serialization.write-dates-as-timestamps=false

spring.jackson.default-property-inclusion=non_null

spring.jackson.time-zone=Asia/Kolkata

##################################################
# SERVER ERROR
##################################################

server.error.include-message=always

server.error.include-binding-errors=always

server.error.include-stacktrace=never

##################################################
# USER REGISTRATION
##################################################

user.registration.enabled=true

user.registration.auto-activate=false

user.email-verification.enabled=true

user.mobile-verification.enabled=true

##################################################
# PASSWORD POLICY
##################################################

user.password.min-length=8

user.password.require-uppercase=true

user.password.require-lowercase=true

user.password.require-number=true

user.password.require-special-character=true

##################################################
# ACCOUNT SECURITY
##################################################

user.account.lock-enabled=true

user.account.max-login-attempts=5

user.account.lock-duration-minutes=30

user.session.timeout-minutes=30

##################################################
# PROFILE SETTINGS
##################################################

user.profile.image-upload-enabled=true

user.profile.image-storage-path=user-profile-images/

user.profile.default-avatar=default-avatar.png

##################################################
# USER PREFERENCES
##################################################

user.preferences.enabled=true

user.preferences.default-language=en

user.preferences.default-timezone=Asia/Kolkata

##################################################
# NOTIFICATION SETTINGS
##################################################

user.notification.email-enabled=true

user.notification.sms-enabled=true

user.notification.push-enabled=true

##################################################
# REPORT SETTINGS
##################################################

user.report.enabled=true

user.report.export-path=user-reports/

##################################################
# AUDIT
##################################################

user.audit.enabled=true

##################################################
# FILE UPLOAD
##################################################

spring.servlet.multipart.max-file-size=20MB

spring.servlet.multipart.max-request-size=20MB