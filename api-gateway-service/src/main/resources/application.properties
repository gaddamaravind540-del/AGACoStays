spring.application.name=api-gateway-service
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
server.port=8080

# Spring Cloud Gateway (WebFlux)
spring.cloud.gateway.server.webflux.discovery.locator.enabled=false
spring.cloud.gateway.server.webflux.metrics.enabled=true

# Downstream service URLs - override through environment variables for Docker/Kubernetes.
gateway.services.auth-url=${AUTH_SERVICE_URL:http://localhost:8081}
gateway.services.user-url=${USER_SERVICE_URL:http://localhost:8082}
gateway.services.branch-url=${BRANCH_SERVICE_URL:http://localhost:8083}
gateway.services.room-url=${ROOM_SERVICE_URL:http://localhost:8084}
gateway.services.booking-url=${BOOKING_SERVICE_URL:http://localhost:8085}
gateway.services.restaurant-url=${RESTAURANT_SERVICE_URL:http://localhost:8087}
gateway.services.payment-url=${PAYMENT_SERVICE_URL:http://localhost:8088}
gateway.services.billing-url=${BILLING_SERVICE_URL:http://localhost:8089}
gateway.services.notification-url=${NOTIFICATION_SERVICE_URL:http://localhost:8090}
gateway.services.attendance-url=${ATTENDANCE_SERVICE_URL:http://localhost:8092}
gateway.services.payroll-url=${PAYROLL_SERVICE_URL:http://localhost:8093}
gateway.services.analytics-url=${ANALYTICS_SERVICE_URL:http://localhost:8094}
gateway.services.support-url=${SUPPORT_SERVICE_URL:http://localhost:8095}

# JWT - must match the signing secret used by Auth Service.
# Use a long base64-encoded secret in real environments.
gateway.jwt.secret=${JWT_SECRET:c2VjdXJlLWFnYS1jb3N0YXlzLWp3dC1zZWNyZXQta2V5LW11c3QtYmUtbG9uZw==}

# Redis rate limiting
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
app.gateway.rate-limit.replenish-rate=${RATE_LIMIT_REPLENISH_RATE:20}
app.gateway.rate-limit.burst-capacity=${RATE_LIMIT_BURST_CAPACITY:40}
app.gateway.rate-limit.fail-open=${RATE_LIMIT_FAIL_OPEN:true}

# CORS
gateway.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
gateway.cors.allowed-methods=${CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
gateway.cors.allowed-headers=${CORS_ALLOWED_HEADERS:*}
gateway.cors.allow-credentials=${CORS_ALLOW_CREDENTIALS:true}

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,gateway
management.endpoint.health.show-details=when_authorized
management.endpoint.gateway.access=UNRESTRICTED
management.info.env.enabled=true

# Timeouts
spring.cloud.gateway.server.webflux.httpclient.connect-timeout=3000
spring.cloud.gateway.server.webflux.httpclient.response-timeout=10s

# Observability
logging.level.com.agacostays.gateway=INFO
logging.level.org.springframework.cloud.gateway=WARN
