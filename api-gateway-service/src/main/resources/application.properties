##################################################
# APPLICATION & SERVER CONFIGURATION
##################################################
spring.application.name=api-gateway-service
server.port=8084

##################################################
# EUREKA DISCOVERY CLIENT
##################################################
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

##################################################
# GATEWAY ROUTE CONFIG INJECTION TARGETS
# (For GatewayRouteConfig.java @Value targets)
##################################################
gateway.services.auth-url=lb://AUTH-SERVICE
gateway.services.user-url=lb://USER-SERVICE
gateway.services.branch-url=lb://BRANCH-SERVICE
gateway.services.room-url=lb://ROOM-SERVICE
gateway.services.booking-url=lb://BOOKING-SERVICE
gateway.services.restaurant-url=lb://RESTAURANT-SERVICE
gateway.services.payment-url=lb://PAYMENT-SERVICE
gateway.services.billing-url=lb://BILLING-SERVICE
gateway.services.notification-url=lb://NOTIFICATION-SERVICE
gateway.services.support-url=lb://SUPPORT-FEEDBACK-SERVICE
gateway.services.support-feedback-url=lb://SUPPORT-FEEDBACK-SERVICE
gateway.services.feedback-url=lb://SUPPORT-FEEDBACK-SERVICE
gateway.services.attendance-url=lb://ATTENDANCE-SERVICE
gateway.services.payroll-url=lb://PAYROLL-SERVICE
gateway.services.analytics-url=lb://ANALYTICS-SERVICE

# Singular aliases
gateway.service.auth-url=lb://AUTH-SERVICE
gateway.service.user-url=lb://USER-SERVICE
gateway.service.branch-url=lb://BRANCH-SERVICE
gateway.service.room-url=lb://ROOM-SERVICE
gateway.service.booking-url=lb://BOOKING-SERVICE
gateway.service.restaurant-url=lb://RESTAURANT-SERVICE
gateway.service.payment-url=lb://PAYMENT-SERVICE
gateway.service.billing-url=lb://BILLING-SERVICE
gateway.service.notification-url=lb://NOTIFICATION-SERVICE
gateway.service.support-url=lb://SUPPORT-FEEDBACK-SERVICE
gateway.service.attendance-url=lb://ATTENDANCE-SERVICE
gateway.service.payroll-url=lb://PAYROLL-SERVICE
gateway.service.analytics-url=lb://ANALYTICS-SERVICE

##################################################
# SPRING CLOUD 2025 GATEWAY DISCOVERY LOCATOR
##################################################
spring.cloud.gateway.server.webflux.discovery.locator.enabled=true
spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true

##################################################
# SPRING CLOUD GATEWAY ROUTES (2025 WEBFLUX NAMESPACE)
##################################################

# 1. Auth Service Routes
spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**

# 2. User Service Routes
spring.cloud.gateway.server.webflux.routes[1].id=user-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://USER-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/users/**,/api/roles/**,/api/staff-assignments/**

# 3. Branch Service Routes
spring.cloud.gateway.server.webflux.routes[2].id=branch-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://BRANCH-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/hotel-branches/**,/api/cities/**

# 4. Room Service Routes
spring.cloud.gateway.server.webflux.routes[3].id=room-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://ROOM-SERVICE
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/rooms/**,/api/room-types/**

# 5. Booking Service Routes
spring.cloud.gateway.server.webflux.routes[4].id=booking-service
spring.cloud.gateway.server.webflux.routes[4].uri=lb://BOOKING-SERVICE
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/bookings/**,/internal/api/bookings/**

# 6. Restaurant Service Routes
spring.cloud.gateway.server.webflux.routes[5].id=restaurant-service
spring.cloud.gateway.server.webflux.routes[5].uri=lb://RESTAURANT-SERVICE
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/restaurant/**,/api/menu-categories/**,/api/menu-items/**,/api/orders/**

# 7. Payment Service Routes
spring.cloud.gateway.server.webflux.routes[6].id=payment-service
spring.cloud.gateway.server.webflux.routes[6].uri=lb://PAYMENT-SERVICE
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/api/payments/**,/api/refunds/**

# 8. Billing Service Routes
spring.cloud.gateway.server.webflux.routes[7].id=billing-service
spring.cloud.gateway.server.webflux.routes[7].uri=lb://BILLING-SERVICE
spring.cloud.gateway.server.webflux.routes[7].predicates[0]=Path=/api/bills/**,/api/invoices/**

# 9. Notification Service Routes
spring.cloud.gateway.server.webflux.routes[8].id=notification-service
spring.cloud.gateway.server.webflux.routes[8].uri=lb://NOTIFICATION-SERVICE
spring.cloud.gateway.server.webflux.routes[8].predicates[0]=Path=/api/notifications/**

# 10. Support & Feedback Service Routes
spring.cloud.gateway.server.webflux.routes[9].id=support-feedback-service
spring.cloud.gateway.server.webflux.routes[9].uri=lb://SUPPORT-FEEDBACK-SERVICE
spring.cloud.gateway.server.webflux.routes[9].predicates[0]=Path=/api/support/**,/api/feedback/**,/api/reviews/**

# 11. Attendance Service Routes
spring.cloud.gateway.server.webflux.routes[10].id=attendance-service
spring.cloud.gateway.server.webflux.routes[10].uri=lb://ATTENDANCE-SERVICE
spring.cloud.gateway.server.webflux.routes[10].predicates[0]=Path=/api/attendance/**,/api/shifts/**

# 12. Payroll Service Routes
spring.cloud.gateway.server.webflux.routes[11].id=payroll-service
spring.cloud.gateway.server.webflux.routes[11].uri=lb://PAYROLL-SERVICE
spring.cloud.gateway.server.webflux.routes[11].predicates[0]=Path=/api/payroll/**,/api/salary-slips/**

# 13. Analytics Service Routes
spring.cloud.gateway.server.webflux.routes[12].id=analytics-service
spring.cloud.gateway.server.webflux.routes[12].uri=lb://ANALYTICS-SERVICE
spring.cloud.gateway.server.webflux.routes[12].predicates[0]=Path=/api/analytics/**,/api/reports/**

