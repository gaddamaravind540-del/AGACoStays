##################################################
# APPLICATION
##################################################

spring.application.name=api-gateway-service

##################################################
# SERVER
##################################################

server.port=8080

##################################################
# EUREKA
##################################################

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

eureka.instance.prefer-ip-address=true

##################################################
# SPRING CLOUD GATEWAY
##################################################

spring.cloud.gateway.server.webflux.discovery.locator.enabled=true
spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true

spring.cloud.gateway.server.webflux.metrics.enabled=true

##################################################
# ROUTES
##################################################

spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://auth-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.routes[1].id=user-service
spring.cloud.gateway.routes[1].uri=lb://user-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/users/**

spring.cloud.gateway.routes[2].id=branch-service
spring.cloud.gateway.routes[2].uri=lb://branch-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/branches/**

spring.cloud.gateway.routes[3].id=booking-service
spring.cloud.gateway.routes[3].uri=lb://booking-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/bookings/**

spring.cloud.gateway.routes[4].id=payment-service
spring.cloud.gateway.routes[4].uri=lb://payment-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/payments/**

spring.cloud.gateway.routes[5].id=billing-service
spring.cloud.gateway.routes[5].uri=lb://billing-service
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/billing/**

spring.cloud.gateway.routes[6].id=notification-service
spring.cloud.gateway.routes[6].uri=lb://notification-service
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/notifications/**

spring.cloud.gateway.routes[7].id=attendance-service
spring.cloud.gateway.routes[7].uri=lb://attendance-service
spring.cloud.gateway.routes[7].predicates[0]=Path=/api/attendance/**

spring.cloud.gateway.routes[8].id=payroll-service
spring.cloud.gateway.routes[8].uri=lb://payroll-service
spring.cloud.gateway.routes[8].predicates[0]=Path=/api/payroll/**

spring.cloud.gateway.routes[9].id=analytics-service
spring.cloud.gateway.routes[9].uri=lb://analytics-service
spring.cloud.gateway.routes[9].predicates[0]=Path=/api/analytics/**

spring.cloud.gateway.routes[10].id=support-feedback-service
spring.cloud.gateway.routes[10].uri=lb://support-feedback-service
spring.cloud.gateway.routes[10].predicates[0]=Path=/api/support/**

##################################################
# JWT
##################################################

gateway.jwt.secret=c2VjdXJlLWFnYS1jb3N0YXlzLWp3dC1zZWNyZXQta2V5LW11c3QtYmUtbG9uZw==

##################################################
# REDIS
##################################################

spring.data.redis.host=localhost
spring.data.redis.port=6379

##################################################
# RATE LIMITING
##################################################

app.gateway.rate-limit.replenish-rate=20
app.gateway.rate-limit.burst-capacity=40
app.gateway.rate-limit.fail-open=true

##################################################
# CORS
##################################################

gateway.cors.allowed-origins=http://localhost:3000
gateway.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
gateway.cors.allowed-headers=*
gateway.cors.allow-credentials=true

##################################################
# ACTUATOR
##################################################

management.endpoints.web.exposure.include=health,info,metrics,gateway
management.endpoint.health.show-details=always
management.endpoint.gateway.access=UNRESTRICTED
management.info.env.enabled=true

##################################################
# TIMEOUTS
##################################################

spring.cloud.gateway.server.webflux.httpclient.connect-timeout=3000
spring.cloud.gateway.server.webflux.httpclient.response-timeout=10s

##################################################
# LOGGING
##################################################

logging.level.com.agacostays.gateway=INFO
logging.level.org.springframework.cloud.gateway=INFO
logging.level.reactor.netty=INFO