##################################################
# EMAIL / SMTP CONFIGURATION (DEV SAFE)
##################################################
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=notifications@agacostays.com
spring.mail.password=password
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
notification.email.from=notifications@agacostays.com
notification.mail.from=notifications@agacostays.com
notification.email.enabled=false
notification.sms.enabled=false
app.notification.email-enabled=false
app.notification.sms-enabled=false

##################################################
# SWAGGER & ACTUATOR
##################################################
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.health.mail.enabled=false

##################################################
# LOGGING & JACKSON
##################################################
logging.level.com.agacostays=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=INFO
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null
spring.jackson.time-zone=Asia/Kolkata
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never