spring.application.name=notification-service
server.port=${SERVER_PORT:8090}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/notification_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Optional in Spring Boot 3.x
 spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${KAFKA_GROUP_ID:notification-service}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.producer.acks=all
spring.kafka.listener.ack-mode=manual
spring.kafka.listener.missing-topics-fatal=false

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:2525}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}

notification.email.enabled=${NOTIFICATION_EMAIL_ENABLED:false}
notification.email.from=${NOTIFICATION_EMAIL_FROM:no-reply@agacostays.com}

notification.sms.enabled=${NOTIFICATION_SMS_ENABLED:false}
notification.sms.api-url=${NOTIFICATION_SMS_API_URL:}
notification.sms.api-key=${NOTIFICATION_SMS_API_KEY:}
notification.sms.sender-id=${NOTIFICATION_SMS_SENDER_ID:AGACOSTAYS}

notification.jwt.secret=${NOTIFICATION_JWT_SECRET:VGhpcy1kZXYtc2VjcmV0LW11c3QtYmUtcmVwbGFjZWQtd2l0aC1hLXN0cm9uZy1zZWNyZXQ=}

notification.retry.max-attempts=${NOTIFICATION_RETRY_MAX_ATTEMPTS:3}
notification.scheduler.fixed-delay-ms=${NOTIFICATION_SCHEDULER_DELAY_MS:60000}
notification.scheduler.lock-attempt-minutes=${NOTIFICATION_SCHEDULER_LOCK_ATTEMPTS:10}

spring.jackson.time-zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false

notification.user-service.base-url=${NOTIFICATION_USER_SERVICE_URL:http://localhost:8082}