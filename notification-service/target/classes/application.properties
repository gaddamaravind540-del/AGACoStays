##################################################
# APPLICATION & SERVER CONFIGURATION
##################################################
spring.application.name=notification-service
server.port=8090

##################################################
# MYSQL DATABASE CONFIGURATION
##################################################
spring.datasource.url=jdbc:mysql://localhost:3306/notification_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

##################################################
# JPA / HIBERNATE
##################################################
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Auto-escape all SQL identifiers for reserved keywords
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# Disable Flyway to prevent PostgreSQL DDL syntax conflicts on MySQL
spring.flyway.enabled=false

##################################################
# HIKARI CONNECTION POOL
##################################################
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

##################################################
# EUREKA DISCOVERY CLIENT
##################################################
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

##################################################
# OPENFEIGN & DOWNSTREAM CLIENT URLS
##################################################
spring.cloud.openfeign.circuitbreaker.enabled=true
services.user-service=user-service
services.booking-service=booking-service
services.user.url=http://localhost:8082
services.user-service.url=http://localhost:8082
services.booking.url=http://localhost:8086
services.booking-service.url=http://localhost:8086
app.clients.user-service-url=http://localhost:8082
app.clients.booking-service-url=http://localhost:8086

##################################################
# KAFKA CONFIGURATION
##################################################
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=notification-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.admin.fail-on-error=false
spring.kafka.listener.missing-topics-fatal=false

##################################################
# JWT AUTHENTICATION (ALL PREFIXES & ALIASES)
##################################################
notification.jwt.secret=c2VjdXJlLWFnYS1jb3N0YXlzLWF1dGgtc2VjcmV0LWtleS1mb3ItcHJvamVjdC0yMDI2
notification.jwt.issuer=aga-costays
