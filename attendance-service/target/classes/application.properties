spring.application.name=attendance-service
server.port=8092

spring.datasource.url=${ATTENDANCE_DB_URL:jdbc:mysql://localhost:3306/attendance_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${ATTENDANCE_DB_USERNAME:root}
spring.datasource.password=${ATTENDANCE_DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

service.user.url=${USER_SERVICE_URL:http://localhost:8082}
service.payroll.url=${PAYROLL_SERVICE_URL:http://localhost:8093}

attendance.missed-checkout.enabled=${MISSED_CHECKOUT_ENABLED:true}
attendance.missed-checkout.hour=${MISSED_CHECKOUT_HOUR:23}
attendance.default-workday-hours=${ATTENDANCE_DEFAULT_WORKDAY_HOURS:8}

security.jwt.secret=${JWT_SECRET:change-this-secret-key-to-a-long-random-value-1234567890}
security.jwt.issuer=${JWT_ISSUER:aga-costays-auth}

management.endpoints.web.exposure.include=health,info,metrics

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

spring.jackson.serialization.write-dates-as-timestamps=false

logging.level.com.agacostays.attendance=INFO