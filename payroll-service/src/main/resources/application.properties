##################################################
# APPLICATION & SERVER CONFIGURATION
##################################################
spring.application.name=payroll-service
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
server.port=8093

##################################################
# MYSQL DATABASE CONFIGURATION
##################################################
spring.datasource.url=jdbc:mysql://localhost:3306/payroll_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

##################################################
# JPA / HIBERNATE
##################################################
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Auto-escape all SQL identifiers for reserved keywords (month, year, status, etc.)
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# Disable Flyway to prevent PostgreSQL DDL syntax conflicts on MySQL
spring.flyway.enabled=false

##################################################
# HIKARI CONNECTION POOL
##################################################
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

##################################################
# EUREKA DISCOVERY CLIENT
##################################################
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

##################################################
# DOWNSTREAM SERVICE URLS (FEIGN & REST CLIENTS)
##################################################
spring.cloud.openfeign.circuitbreaker.enabled=true

# Service Name Mappings
services.attendance-service=attendance-service
services.user-service=user-service
services.branch-service=branch-service
services.notification-service=notification-service

# Attendance Service (Port 8092)
services.attendance.url=http://localhost:8092
services.attendance.base-url=http://localhost:8092
services.attendance-service.url=http://localhost:8092
services.attendance-service.base-url=http://localhost:8092
service.attendance.url=http://localhost:8092
service.attendance.base-url=http://localhost:8092
app.clients.attendance-service-url=http://localhost:8092

# User Service (Port 8082)
services.user.url=http://localhost:8082
services.user.base-url=http://localhost:8082
services.user-service.url=http://localhost:8082
services.user-service.base-url=http://localhost:8082
service.user.url=http://localhost:8082
service.user.base-url=http://localhost:8082
app.clients.user-service-url=http://localhost:8082

# Branch Service (Port 8083)
services.branch.url=http://localhost:8083
services.branch.base-url=http://localhost:8083
services.branch-service.url=http://localhost:8083
services.branch-service.base-url=http://localhost:8083
service.branch.url=http://localhost:8083
service.branch.base-url=http://localhost:8083
app.clients.branch-service-url=http://localhost:8083

# Notification Service (Port 8090)
services.notification.url=http://localhost:8090
services.notification.base-url=http://localhost:8090
services.notification-service.url=http://localhost:8090
services.notification-service.base-url=http://localhost:8090
service.notification.url=http://localhost:8090
service.notification.base-url=http://localhost:8090
app.clients.notification-service-url=http://localhost:8090

##################################################
# KAFKA CONFIGURATION
##################################################
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=payroll-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.admin.fail-on-error=false
spring.kafka.listener.missing-topics-fatal=false

