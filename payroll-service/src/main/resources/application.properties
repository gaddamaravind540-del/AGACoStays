spring.application.name=payroll-service
server.port=8093

spring.datasource.url=${PAYROLL_DB_URL:jdbc:mysql://localhost:3306/payroll_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${PAYROLL_DB_USERNAME:root}
spring.datasource.password=${PAYROLL_DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=true

# Optional in Spring Boot 3.x
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

service.user.url=${USER_SERVICE_URL:http://localhost:8082}
service.attendance.url=${ATTENDANCE_SERVICE_URL:http://localhost:8092}
service.notification.url=${NOTIFICATION_SERVICE_URL:http://localhost:8090}

payroll.currency=${PAYROLL_CURRENCY:INR}
payroll.default-working-days=${PAYROLL_DEFAULT_WORKING_DAYS:26}
payroll.auto-generate-enabled=${PAYROLL_AUTO_GENERATE_ENABLED:false}
payroll.auto-generate.cron=${PAYROLL_AUTO_GENERATE_CRON:0 0 2 1 * *}
payroll.storage.path=${PAYROLL_STORAGE_PATH:./storage/salary-slips}

security.jwt.secret=${JWT_SECRET:change-this-secret-key-to-a-long-random-value-1234567890}
security.jwt.issuer=${JWT_ISSUER:aga-costays-auth}

management.endpoints.web.exposure.include=health,info,metrics

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

spring.jackson.serialization.write-dates-as-timestamps=false

logging.level.com.agacostays.payroll=INFO