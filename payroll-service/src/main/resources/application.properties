##################################################
# PAYROLL STORAGE & FILE PATH CONFIGURATION
##################################################
payroll.storage.path=payslips/
payroll.storage.root=uploads
payroll.storage.dir=payslips/
payroll.storage.directory=payslips/
payroll.storage.base-path=payslips/
payroll.storage.upload-dir=payslips/
payroll.payslip.storage-path=payslips/
payroll.payslip.storage.path=payslips/
payroll.payslip.path=payslips/
payroll.payslip.prefix=PS-
storage.local.root=uploads
storage.path=payslips/
storage.location=payslips/

##################################################
# PAYROLL, SALARY & DEDUCTION SETTINGS
##################################################
payroll.currency=INR
payroll.default-currency=INR
payroll.tax.tds-percentage=10.0
payroll.default-tds-rate=10.0
payroll.provident-fund-percentage=12.0
payroll.default-pf-rate=12.0
payroll.standard-working-days=26
payroll.overtime-hourly-multiplier=1.5

##################################################
# PAYROLL SCHEDULER & AUTO-GENERATION SETTINGS
##################################################
payroll.auto-generate-enabled=true
payroll.auto-generate-cron=0 0 1 1 * ?
payroll.auto-generate.enabled=true
payroll.auto-generate.cron=0 0 1 1 * ?
payroll.scheduler.enabled=true
payroll.scheduler.cron=0 0 1 1 * ?
payroll.schedule.cron=0 0 1 1 * ?
payroll.cron=0 0 1 1 * ?

##################################################
# SWAGGER & ACTUATOR
##################################################
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

##################################################
# LOGGING & JACKSON
##################################################
logging.level.com.agacostays=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=INFO
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null
spring.jackson.time-zone=Asia/Kolkata
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never