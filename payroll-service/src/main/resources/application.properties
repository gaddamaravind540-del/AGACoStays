spring.application.name=payroll-service
server.port=8093

spring.datasource.url=${PAYROLL_DB_URL:jdbc:postgresql://localhost:5432/payroll_db}
spring.datasource.username=${PAYROLL_DB_USERNAME:postgres}
spring.datasource.password=${PAYROLL_DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

service.user.url=${USER_SERVICE_URL:http://localhost:8082}
service.attendance.url=${ATTENDANCE_SERVICE_URL:http://localhost:8092}
service.notification.url=${NOTIFICATION_SERVICE_URL:http://localhost:8090}

payroll.currency=${PAYROLL_CURRENCY:INR}
payroll.default-working-days=${PAYROLL_DEFAULT_WORKING_DAYS:26}
payroll.auto-generate-enabled=${PAYROLL_AUTO_GENERATE_ENABLED:false}
payroll.auto-generate.cron=${PAYROLL_AUTO_GENERATE_CRON:0 0 2 1 * *}
payroll.storage.path=${PAYROLL_STORAGE_PATH:./storage/salary-slips}

security.jwt.secret=${JWT_SECRET:change-this-secret-key-to-a-long-random-value-1234567890}
security.jwt.issuer=${JWT_ISSUER:aga-costays-auth}

management.endpoints.web.exposure.include=health,info,metrics
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
spring.jackson.serialization.write-dates-as-timestamps=false
logging.level.com.agacostays.payroll=INFO
