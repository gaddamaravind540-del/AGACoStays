##################################################
# APPLICATION
##################################################

spring.application.name=payroll-service
server.port=8089

##################################################
# MYSQL DATABASE
##################################################

spring.datasource.url=${PAYROLL_DB_URL:jdbc:mysql://localhost:3306/payroll_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${PAYROLL_DB_USERNAME:root}
spring.datasource.password=${PAYROLL_DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

##################################################
# JPA / HIBERNATE
##################################################

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=true

##################################################
# HIKARI CONNECTION POOL
##################################################

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

##################################################
# EUREKA
##################################################

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

##################################################
# OPENFEIGN
##################################################

spring.cloud.openfeign.circuitbreaker.enabled=true

##################################################
# KAFKA
##################################################

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

spring.kafka.consumer.group-id=payroll-service-group
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=*

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

##################################################
# SERVICE INTEGRATIONS
##################################################

service.user.url=${USER_SERVICE_URL:http://localhost:8082}
service.attendance.url=${ATTENDANCE_SERVICE_URL:http://localhost:8088}
service.notification.url=${NOTIFICATION_SERVICE_URL:http://localhost:8086}

##################################################
# JWT
##################################################

security.jwt.secret=${JWT_SECRET:change-this-secret-key-to-a-long-random-value-1234567890}
security.jwt.issuer=${JWT_ISSUER:aga-costays-auth}

##################################################
# PAYROLL CONFIGURATION
##################################################

payroll.currency=${PAYROLL_CURRENCY:INR}

payroll.default-working-days=${PAYROLL_DEFAULT_WORKING_DAYS:26}

payroll.default-status=PENDING

payroll.salary-processing.enabled=true

payroll.auto-generate-enabled=${PAYROLL_AUTO_GENERATE_ENABLED:false}

payroll.auto-generate.cron=${PAYROLL_AUTO_GENERATE_CRON:0 0 2 1 * *}

payroll.auto-generate-payslip=true

payroll.storage.path=${PAYROLL_STORAGE_PATH:./storage/salary-slips}

##################################################
# SALARY SETTINGS
##################################################

payroll.salary.process-day=1

payroll.minimum-working-days=20

payroll.maximum-working-days=31

##################################################
# DEDUCTIONS
##################################################

payroll.pf.enabled=true
payroll.pf.percentage=12

payroll.esi.enabled=true
payroll.esi.percentage=0.75

payroll.professional-tax.enabled=true

##################################################
# BONUS SETTINGS
##################################################

payroll.bonus.enabled=true

payroll.performance-bonus.enabled=true

##################################################
# OVERTIME SETTINGS
##################################################

payroll.overtime.enabled=true

payroll.overtime.multiplier=1.5

##################################################
# PAYSLIP SETTINGS
##################################################

payroll.payslip.generate-pdf=true

payroll.payslip.storage-path=payslips/

##################################################
# REPORT SETTINGS
##################################################

payroll.report.auto-generate=true

payroll.report.schedule=0 0 2 1 * *

##################################################
# SWAGGER / OPENAPI
##################################################

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

##################################################
# ACTUATOR
##################################################

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

##################################################
# JACKSON
##################################################

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Asia/Kolkata
spring.jackson.default-property-inclusion=non_null

##################################################
# SERVER ERROR
##################################################

server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never

##################################################
# AUDIT
##################################################

payroll.audit.enabled=true

##################################################
# FILE UPLOAD
##################################################

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

##################################################
# LOGGING
##################################################
#
logging.level.com.agacostays.payroll=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.security=INFO
