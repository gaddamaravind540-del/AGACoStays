server.port=8091
spring.application.name=support-feedback-service

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/support_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=support-feedback-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.properties.spring.json.trusted.packages=com.agacostays.*

services.booking.url=${BOOKING_SERVICE_URL:http://localhost:8086}
services.restaurant.url=${RESTAURANT_SERVICE_URL:http://localhost:8087}
services.notification.url=${NOTIFICATION_SERVICE_URL:http://localhost:8090}
services.user.url=${USER_SERVICE_URL:http://localhost:8082}

security.jwt.secret=${JWT_SECRET:change-this-development-secret-to-at-least-32-characters}

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized

logging.level.com.agacostays.support=INFO
