##################################################
# APPLICATION
##################################################

spring.application.name=support-feedback-service
server.port=8091

##################################################
# MYSQL DATABASE
##################################################

spring.datasource.url=jdbc:mysql://localhost:3306/support_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

##################################################
# JPA / HIBERNATE
##################################################

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

##################################################
# HIKARI CONNECTION POOL
##################################################

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

##################################################
# EUREKA
##################################################

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

##################################################
# OPENFEIGN
##################################################

spring.cloud.openfeign.circuitbreaker.enabled=true

##################################################
# FEIGN CLIENT SERVICES
##################################################

services.auth-service=auth-service
services.user-service=user-service
services.booking-service=booking-service
services.notification-service=notification-service
services.branch-service=branch-service

##################################################
# KAFKA
##################################################

spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.consumer.group-id=support-feedback-service-group
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

##################################################
# JWT
##################################################

jwt.secret=your-super-secret-jwt-key-that-should-be-long-and-secure
jwt.expiration=86400000

##################################################
# SWAGGER / OPENAPI
##################################################

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

##################################################
# ACTUATOR
##################################################

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

##################################################
# LOGGING
##################################################

logging.level.com.agacostays=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.security=INFO

##################################################
# JACKSON
##################################################

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null
spring.jackson.time-zone=Asia/Kolkata

##################################################
# SERVER ERROR
##################################################

server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never

##################################################
# SUPPORT CONFIGURATION
##################################################

support.ticket.auto-generate-number=true
support.ticket.prefix=SUP

support.ticket.default-priority=MEDIUM
support.ticket.default-status=OPEN

support.ticket.reopen.enabled=true
support.ticket.reopen-within-days=7

support.ticket.auto-close.enabled=true
support.ticket.auto-close-days=14

##################################################
# TICKET ESCALATION
##################################################

support.escalation.enabled=true

support.escalation.low-hours=48
support.escalation.medium-hours=24
support.escalation.high-hours=8
support.escalation.critical-hours=2

##################################################
# FEEDBACK CONFIGURATION
##################################################

feedback.enabled=true

feedback.rating.min=1
feedback.rating.max=5

feedback.allow-anonymous=false

feedback.followup.enabled=true

##################################################
# CUSTOMER SATISFACTION
##################################################

feedback.csat.enabled=true

feedback.csat.target-score=4.5

##################################################
# REPORT SETTINGS
##################################################

support.report.enabled=true

support.report.auto-generate=true

support.report.export-path=support-reports/

support.report.schedule=0 0 3 * * *

##################################################
# EMAIL NOTIFICATIONS
##################################################

support.notification.email.enabled=true

support.notification.email-on-create=true
support.notification.email-on-update=true
support.notification.email-on-close=true

##################################################
# SMS NOTIFICATIONS
##################################################

support.notification.sms.enabled=true

##################################################
# PUSH NOTIFICATIONS
##################################################

support.notification.push.enabled=true

##################################################
# ATTACHMENTS
##################################################

support.attachment.enabled=true

support.attachment.storage-path=support-attachments/

##################################################
# AUDIT
##################################################

support.audit.enabled=true

##################################################
# FILE UPLOAD
##################################################

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB