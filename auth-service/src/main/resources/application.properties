##################################################
# APPLICATION & SERVER
##################################################
spring.application.name=auth-service
server.port=8081

##################################################
# MYSQL DATABASE CONFIGURATION
##################################################
spring.datasource.url=jdbc:mysql://localhost:3306/auth_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

##################################################
# JPA / HIBERNATE
##################################################
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

##################################################
# HIKARI POOL
##################################################
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

##################################################
# REDIS (Optional in Dev - fail-safe)
##################################################
spring.data.redis.host=localhost
spring.data.redis.port=6379
management.health.redis.enabled=false

##################################################
# EUREKA DISCOVERY CLIENT
##################################################
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

##################################################
# KAFKA CONFIGURATION
##################################################
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=auth-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
# Prevent context crash if Kafka broker is not yet started in local dev
spring.kafka.admin.fail-on-error=false

##################################################
# APP JWT & TOKEN CONFIGURATION (Base64 Encoded)
##################################################
# Base64 string for "secure-aga-costays-auth-secret-key-for-project-2026"
app.jwt.secret=c2VjdXJlLWFnYS1jb3N0YXlzLWF1dGgtc2VjcmV0LWtleS1mb3ItcHJvamVjdC0yMDI2
app.jwt.access-token-expiration-seconds=900
app.jwt.refresh-token-expiration-days=7
app.password-reset.expiration-minutes=15
app.otp.expiration-minutes=5
app.otp.expose-in-development=true
app.cleanup.cron=0 0/30 * * * *

# Fallback property aliases
jwt.secret=c2VjdXJlLWFnYS1jb3N0YXlzLWF1dGgtc2VjcmV0LWtleS1mb3ItcHJvamVjdC0yMDI2
jwt.expiration=86400000

##################################################
# DOWNSTREAM SERVICE CLIENT URLS
##################################################
app.clients.user-service-url=http://localhost:8082
app.clients.notification-service-url=http://localhost:8090
services.user-service=user-service
services.notification-service=notification-service

##################################################
# SWAGGER & ACTUATOR
##################################################
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

##################################################
# SERVER & LOGGING
##################################################
logging.level.com.agacostays=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=INFO
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null
spring.jackson.time-zone=Asia/Kolkata
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never