spring.application.name=payment-service
server.port=8088

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/payment_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.consumer.group-id=payment-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

app.jwt.secret=${JWT_SECRET:change-this-payment-service-jwt-secret-change-me-please}
app.jwt.issuer=${JWT_ISSUER:aga-costays-auth}

payment.gateway.name=${PAYMENT_GATEWAY_NAME:RAZORPAY}
payment.gateway.key-id=${PAYMENT_GATEWAY_KEY_ID:}
payment.gateway.secret=${PAYMENT_GATEWAY_SECRET:}
payment.gateway.webhook-secret=${PAYMENT_GATEWAY_WEBHOOK_SECRET:change-webhook-secret}
payment.gateway.currency=${PAYMENT_GATEWAY_CURRENCY:INR}
payment.gateway.mock-enabled=${PAYMENT_GATEWAY_MOCK_ENABLED:true}

payment.validation.allow-request-amount=${PAYMENT_ALLOW_REQUEST_AMOUNT:true}
payment.reconciliation.pending-age-minutes=${PAYMENT_PENDING_AGE_MINUTES:30}
payment.idempotency.ttl-minutes=${PAYMENT_IDEMPOTENCY_TTL_MINUTES:1440}

services.booking.base-url=${BOOKING_SERVICE_URL:http://localhost:8086}
services.restaurant.base-url=${RESTAURANT_SERVICE_URL:http://localhost:8087}
services.billing.base-url=${BILLING_SERVICE_URL:http://localhost:8089}
services.notification.base-url=${NOTIFICATION_SERVICE_URL:http://localhost:8090}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized
