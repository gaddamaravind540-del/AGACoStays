##################################################
# APPLICATION & SERVER
##################################################
spring.application.name=room-service
server.port=8085

##################################################
# MYSQL DATABASE CONFIGURATION
##################################################
spring.datasource.url=jdbc:mysql://localhost:3306/room_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

##################################################
# JPA / HIBERNATE
##################################################
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Disable Flyway to prevent PostgreSQL DDL syntax conflicts on MySQL
spring.flyway.enabled=false

##################################################
# HIKARI CONNECTION POOL
##################################################
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

##################################################
# EUREKA DISCOVERY CLIENT
##################################################
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

##################################################
# OPENFEIGN CLIENT URLS
##################################################
spring.cloud.openfeign.circuitbreaker.enabled=true
services.branch.url=http://localhost:8083
services.booking.url=http://localhost:8086
services.branch-service.url=http://localhost:8083
services.booking-service.url=http://localhost:8086

##################################################
# KAFKA CONFIGURATION
##################################################
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=room-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.admin.fail-on-error=false

##################################################
# JWT AUTHENTICATION
##################################################
jwt.secret=c2VjdXJlLWFnYS1jb3N0YXlzLWF1dGgtc2VjcmV0LWtleS1mb3ItcHJvamVjdC0yMDI2
security.jwt.secret=c2VjdXJlLWFnYS1jb3N0YXlzLWF1dGgtc2VjcmV0LWtleS1mb3ItcHJvamVjdC0yMDI2
app.jwt.secret=c2VjdXJlLWFnYS1jb3N0YXlzLWF1dGgtc2VjcmV0LWtleS1mb3ItcHJvamVjdC0yMDI2
jwt.expiration=86400000

##################################################
# FILE UPLOAD & STORAGE CONFIGURATION
##################################################
storage.local.root=uploads
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

##################################################
# SWAGGER & ACTUATOR
##################################################
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

##################################################
# LOGGING & JACKSON
##################################################
logging.level.com.agacostays=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=INFO
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null
spring.jackson.time-zone=Asia/Kolkata
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never