server.port=8085

spring.application.name=room-service

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/room_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=room-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.properties.spring.json.trusted.packages=com.agacostays.*
spring.kafka.producer.properties.spring.json.add.type.headers=true

services.branch.url=${BRANCH_SERVICE_URL:http://localhost:8083}
services.booking.url=${BOOKING_SERVICE_URL:http://localhost:8086}

security.jwt.secret=${JWT_SECRET:change-this-development-secret-to-at-least-32-characters}

storage.local.root=${STORAGE_LOCAL_ROOT:uploads}

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized

logging.level.com.agacostays.room=INFO
logging.level.org.springframework.security=INFO
