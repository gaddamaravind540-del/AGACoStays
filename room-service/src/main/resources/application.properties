server.port=8085

spring.application.name=room-service

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/room_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true

# Optional in Spring Boot 3.x
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=room-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.properties.spring.json.trusted.packages=com.agacostays.*
spring.kafka.producer.properties.spring.json.add.type.headers=true

services.branch.url=${BRANCH_SERVICE_URL:http://localhost:8083}
services.booking.url=${BOOKING_SERVICE_URL:http://localhost:8086}

security.jwt.secret=${JWT_SECRET:change-this-development-secret-to-at-least-32-characters}

storage.local.root=${STORAGE_LOCAL_ROOT:uploads}

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized

logging.level.com.agacostays.room=INFO
logging.level.org.springframework.security=INFO