spring.application.name=analytics-service
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
server.port=8094

spring.datasource.url=${ANALYTICS_DB_URL:jdbc:mysql://localhost:3306/analytics_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${ANALYTICS_DB_USERNAME:root}
spring.datasource.password=${ANALYTICS_DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=true

# Optional in Spring Boot 3 + Hibernate 6
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.properties.spring.json.trusted.packages=com.agacostays.*

service.booking.url=${BOOKING_SERVICE_URL:http://localhost:8086}
service.restaurant.url=${RESTAURANT_SERVICE_URL:http://localhost:8087}
service.payment.url=${PAYMENT_SERVICE_URL:http://localhost:8088}
service.attendance.url=${ATTENDANCE_SERVICE_URL:http://localhost:8092}
service.payroll.url=${PAYROLL_SERVICE_URL:http://localhost:8093}

analytics.storage.path=${ANALYTICS_STORAGE_PATH:./storage/reports}

security.jwt.secret=${JWT_SECRET:change-this-secret-key-to-a-long-random-value-1234567890}
security.jwt.issuer=${JWT_ISSUER:aga-costays-auth}

management.endpoints.web.exposure.include=health,info,metrics

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

spring.jackson.serialization.write-dates-as-timestamps=false

logging.level.com.agacostays.analytics=INFO